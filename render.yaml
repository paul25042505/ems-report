# Render 一鍵部署設定（Blueprint）
# 需要 Starter 方案：免費方案沒有永久磁碟，重新部署會遺失資料庫
services:
  - type: web
    name: ems-report
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /login
    disk:
      name: ems-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
